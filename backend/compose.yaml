name: blindbox

services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=blindbox'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306:3306'
    networks:
      - app-network

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    command: ["redis-server", "--appendonly", "yes", "--replicaof", "no", "one"]

networks:
  app-network:
    driver: bridge