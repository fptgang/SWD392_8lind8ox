spring.application.name=backend
spring.docker.compose.file=compose.yaml

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/blindbox
spring.datasource.username=myuser
spring.datasource.password=verysecret

#hibernate
spring.jpa.hibernate.ddl-auto=update

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.syntax-highlight.theme=agate
springdoc.swagger-ui.try-it-out-enabled=true

#jwt
jwt.private.key=classpath:key.pem
jwt.public.key=classpath:certificate.pem

#test-container sql
spring.sql.init.mode=always

FRONTEND_CORS_SERVER=http://localhost:5173

RESEND_API_KEY= ${RESEND_API_KEY}
COMPANY_NAME=${COMPANY_NAME}
EMAIL_FROM=admin@mail.biddify.fun

VNPAY_VERSION=2.1.0
VNPAY_PAY_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
VNPAY_TMN_CODE=USCOXCLZ
VNPAY_SECRET_KEY=KJS7W0VAW8P340MYISO7QYGRJQT50ZKS
VNPAY_RETURN_URL=http://localhost:5173/payment/vnpay/return

currencyapi.key= cur_live_AnWFX74Up7VEkxJ1mvtAPcEUBV1RStPasxbANk4N

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=100MB

#azure
spring.cloud.azure.storage.blob.account-name=${AZURE_STORAGE_ACCOUNT_NAME}
spring.cloud.azure.storage.blob.connection-string=${AZURE_STORAGE_ACCOUNT_ENDPOINT}
spring.cloud.azure.storage.blob.sas-token=${AZURE_STORAGE_SAS_TOKEN}
spring.cloud.azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME}
spring.cloud.azure.storage.blob.account-key=${AZURE_STORAGE_ACCOUNT_KEY}

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8

spring.jackson.default-property-inclusion=non_null
spring.jpa.show-sql=false

voucher.default.discountRate=0.1
voucher.default.limitAmount=100
voucher.default.expiredMonths=1
voucher.default.codeLength=10

# JWT and token configurations
jwt.expiry.minutes=15
jwt.refresh.expiry.days=7
password.reset.expiry.minutes=15
date.format.vnpay=yyyyMMddHHmmss

# Currency configuration
currency.exchange.cache.key=CurrencyExchangeRate
currency.exchange.default.rate=25000
currency.exchange.cache.ttl.days=1

# VNPAY configuration
vnpay.order.type=250000
vnpay.locale=vn
vnpay.expire.minutes=15

# Email templates
email.video.title=🚀 Your Exclusive Unboxing Video is Now Live!
email.video.template=<h1>🎥 Your Video is Ready!</h1><p>Dear %s,</p><p>We are excited to inform you that your unboxing video has been successfully uploaded!</p><p>Click the link below to watch your video:</p>%s<br><p>Thank you for being with us!</p><p>Best regards,</p><p><strong>Your Company Team</strong></p>
email.password.reset.title=Password Reset Request
email.password.reset.template=Hello %s,\n\nYou have requested to reset your password. Please click the link below to reset it:\n%s\n\nThis link will expire in %d minutes.\n\nIf you didn't request this, please ignore this email.\n\nBest regards,\nYour Application Team