VideoDto:
  type: object
  properties:
    videoId:
      type: integer
      format: int64
    account:
      $ref: "account.yml#/AccountDto"
    slotId:
      type: integer
      format: int64
    url:
      type: string
    description:
      type: string
    isVisible:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    isVerified:
      type: boolean
