CartDto:
  type: object
  properties:
    voucherId:
      type: integer
      format: int64
    items:
      type: array
      items:
        $ref: "cart-item.yml#/CartItemDto"
    shippingInfoId:
      type: integer
      format: int64
    paymentMethod:
      type: string
      enum: [INTERNAL_WALLET, PAYPAL, VNPAY, PAYOS]
