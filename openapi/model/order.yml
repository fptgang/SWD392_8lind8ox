OrderDto:
  type: object
  properties:
    orderId:
      type: integer
      format: int64
    account:
      $ref: "account.yml#/AccountDto"
    orderStatusHistories:
      type: array
      items:
        $ref: "order-status-history.yml#/OrderStatusHistoryDto"
    latestStatus:
      $ref: "order-status.yml#/OrderStatus"
    orderDetails:
      type: array
      items:
        $ref: "order-detail.yml#/OrderDetailDto"
    transaction:
      $ref: "transaction.yml#/TransactionDto"
    voucher:
      $ref: "voucher.yml#/VoucherDto"
    shippingInfo:
      $ref: "shipping-info.yml#/ShippingInfoDto"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    subTotal:
      type: number
      format: double
    finalTotal:
      type: number
      format: double