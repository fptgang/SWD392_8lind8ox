TransactionDto:
  type: object
  properties:
    transactionId:
      type: integer
      format: int64
    account:
      $ref: "account.yml#/AccountDto"
    type:
      type: string
      enum: [DEPOSIT, ORDER]
    paymentMethod:
      type: string
      enum: [PAYPAL, VNPAY]
    createdAt:
      type: string
      format: date-time
    amount:
      type: number
      format: double
    oldBalance:
      type: number
      format: double
    newBalance:
      type: number
      format: double
    orderId:
      type: integer
      format: int64
    status:
      type: string
      enum: [ PENDING, SUCCESS, FAILED ]
