VoucherDto:
  type: object
  properties:
    voucherId:
      type: integer
      format: int64
    orderId:
      type: integer
      format: int64
    account:
      $ref: "account.yml#/AccountDto"
    code:
      type: string
    discountRate:
      type: number
      format: double
    limitAmount:
      type: number
      format: double
    state:
      type: string
      enum: [USED, AVAILABLE, RESERVED, EXPIRED]
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    expiredAt:
      type: string
      format: date-time