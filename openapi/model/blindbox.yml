BlindBoxDto:
  type: object
  properties:
    blindBoxId:
      type: integer
      format: int64
    brand:
      $ref: "brand.yml#/BrandDto"
    name:
      type: string
    description:
      type: string
    images:
      type: array
      items:
        $ref: "image.yml#/ImageDto"
    blindBoxCampaigns:
      type: array
      items:
        $ref: "blindbox-campaign.yml#/BlindBoxCampaignDto"
    isVisible:
      type: boolean
    toys:
      type: array
      items:
        $ref: "toy.yml#/ToyDto"
    skus:
      type: array
      items:
        $ref: "stock-keeping-unit.yml#/StockKeepingUnitDto"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time