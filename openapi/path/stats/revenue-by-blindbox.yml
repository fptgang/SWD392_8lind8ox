get:
  summary: Get the total revenue generated by each Blind Box within a given date range
  operationId: getRevenueByBlindBox
  security:
    - bearerAuth: []
  parameters:
    - name: startDate
      in: query
      required: true
      schema:
        type: string
        format: date-time
    - name: endDate
      in: query
      required: true
      schema:
        type: string
        format: date-time
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../model/stats/string-bigdecimal-datapoint.yml#/StringBigDecimalDatapointDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../../component/error.yml#/ErrorResponse'
