get:
  summary: Get the top-selling brands within a specified date range
  operationId: getTopBrands
  security:
    - bearerAuth: []
  parameters:
    - name: startDate
      in: query
      required: true
      schema:
        type: string
        format: date-time
    - name: endDate
      in: query
      required: true
      schema:
        type: string
        format: date-time
    - name: limit
      in: query
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../model/stats/string-integer-datapoint.yml#/StringIntegerDatapointDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../../component/error.yml#/ErrorResponse'
