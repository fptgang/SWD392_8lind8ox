get:
  summary: Get a list of orders
  operationId: getOrders
  security:
    - bearerAuth: []
  parameters:
    - $ref: '../param/pageable.yml#/Pageable'
    - $ref: '../param/filter.yml#/Filter'
    - $ref: '../param/search.yml#/Search'
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../component/page.yml#/Page'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '../model/order.yml#/OrderDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'

post:
  summary: Place an order
  operationId: placeOrder
  security:
    - bearerAuth: []
  requestBody:
    description: The cart
    required: true
    content:
      application/json:
        schema:
          $ref: '../model/cart.yml#/CartDto'
  parameters:
    - name: accountId
      in: query
      required: false
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            type: object
            properties:
              order:
                $ref: '../model/order.yml#/OrderDto'
              paymentRedirectUrl:
                type: string
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'