put:
  summary: Cancel an existing order
  operationId: cancelOrder
  security:
    - bearerAuth: []
  parameters:
    - name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
        description: The operation was successful
        content:
            application/json:
                schema:
                    $ref: '../model/order.yml#/OrderDto'
    '400':
        description: The operation failed
        content:
            application/json:
                schema:
                    $ref: '../component/error.yml#/ErrorResponse'