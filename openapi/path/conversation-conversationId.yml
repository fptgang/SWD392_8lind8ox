
get:
  summary: Get a conversation by ID
  operationId: getConversationById
  security:
    - bearerAuth: []
  parameters:
    - name: conversationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../model/conversation.yml#/ConversationDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'
put:
  summary: Update an existing conversation
  operationId: updateConversation
  security:
    - bearerAuth: []
  parameters:
    - name: conversationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    description: Conversation to update
    required: true
    content:
      application/json:
        schema:
          $ref: '../model/conversation.yml#/ConversationDto'
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../model/conversation.yml#/ConversationDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'
delete:
  summary: Delete an existing conversation
  operationId: deleteConversation
  security:
    - bearerAuth: []
  parameters:
    - name: conversationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '204':
      description: The conversation was deleted successfully
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'