get:
  summary: Get a toy by toyId
  operationId: getToyById
  security:
    - bearerAuth: []
  parameters:
    - name: toyId
      in: path
      required: true
      schema:
        type: integer
        format: int64  # Updated to int64 for consistency with the model
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../model/toy.yml#/ToyDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'

put:
  summary: Update an existing toy
  operationId: updateToy
  security:
    - bearerAuth: []
  parameters:
    - name: toyId
      in: path
      required: true
      schema:
        type: integer
        format: int64  # Updated to int64 for consistency with the model
  requestBody:
    description: Toy to update
    required: true
    content:
      application/json:
        schema:
          $ref: '../model/toy.yml#/ToyDto'
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../model/toy.yml#/ToyDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'

delete:
  summary: Delete an existing toy
  operationId: deleteToy
  security:
    - bearerAuth: []
  parameters:
    - name: toyId
      in: path
      required: true
      schema:
        type: integer
        format: int64  # Updated to int64 for consistency with the model
  responses:
    '200':
      description: The operation was successful
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'