get:
  summary: Get a video by videoId
  operationId: getVideoById
  security:
    - bearerAuth: []
  parameters:
    - name: videoId
      in: path
      required: true
      schema:
        type: integer
        format: int64  # Updated to int64 for consistency with the model
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../model/video.yml#/VideoDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'

put:
  summary: Verified Video
  operationId: verifiedVideo
  security:
    - bearerAuth: []
  parameters:
    - name: videoId
      in: path
      required: true
