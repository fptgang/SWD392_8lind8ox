          schema:
            $ref: '../component/error.yml#/ErrorResponse'

delete:
  summary: Delete an existing video
  operationId: deleteVideo
  security:
    - bearerAuth: []
  parameters:
    - name: videoId
      in: path
      required: true
      schema:
        type: integer
        format: int64  # Updated to int64 for consistency with the model
  responses:
    '200':
