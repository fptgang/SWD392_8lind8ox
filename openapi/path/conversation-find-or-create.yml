# conversation-find-or-create.yml
post:
  summary: Find or create a conversation between user and staff
  operationId: findOrCreateConversation
  security:
    - bearerAuth: []
  parameters:
    - name: userId
      in: query
      required: true
      schema:
        type: integer
        format: int64
    - name: staffId
      in: query
      required: false
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../model/conversation.yml#/ConversationDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'