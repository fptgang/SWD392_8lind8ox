# path/sku-skuId.yml
get:
  summary: Get a StockKeepingUnit by skuId
  operationId: getStockKeepingUnitById
  security:
    - bearerAuth: []
  parameters:
    - name: skuId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../model/stock-keeping-unit.yml#/StockKeepingUnitDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'

put:
  summary: Update an existing StockKeepingUnit
  operationId: updateStockKeepingUnit
  security:
    - bearerAuth: []
  parameters:
    - name: skuId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    description: StockKeepingUnit to update
    required: true
    content:
      application/json:
        schema:
          $ref: '../model/stock-keeping-unit.yml#/StockKeepingUnitDto'
  responses:
    '200':
      description: The operation was successful
      content:
        application/json:
          schema:
            $ref: '../model/stock-keeping-unit.yml#/StockKeepingUnitDto'
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'

delete:
  summary: Delete an existing StockKeepingUnit
  operationId: deleteStockKeepingUnit
  security:
    - bearerAuth: []
  parameters:
    - name: skuId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The operation was successful
    '400':
      description: The operation failed
      content:
        application/json:
          schema:
            $ref: '../component/error.yml#/ErrorResponse'